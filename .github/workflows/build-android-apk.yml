# Build Android APK Workflow
#
# This workflow builds a release APK for the PanoStitch mobile app that can be installed
# directly on Android devices without requiring the Google Play Store.
#
# HOW TO TRIGGER THIS WORKFLOW:
# 1. Manual trigger:
#    - Go to the "Actions" tab in GitHub
#    - Select "Build Android APK" from the workflows list
#    - Click "Run workflow" button
#    - Select the branch and click "Run workflow"
#
# 2. Automatic trigger:
#    - Push a tag matching the pattern "mobile-v*" (e.g., mobile-v1.0.0)
#    - Command: git tag mobile-v1.0.0 && git push origin mobile-v1.0.0
#
# WHERE TO FIND THE GENERATED APK:
# 1. After the workflow completes successfully:
#    - Go to the workflow run page in the Actions tab
#    - Scroll down to the "Artifacts" section
#    - Download "panostitch-android-apk" (the APK will be in a zip file)
# 2. The artifact is retained for 30 days
#
# HOW TO INSTALL THE APK ON YOUR ANDROID DEVICE:
# 1. Extract the APK from the downloaded zip file
# 2. Transfer the APK file to your Android device
# 3. On your device, go to Settings > Security
# 4. Enable "Install from Unknown Sources" or "Install Unknown Apps"
# 5. Use a file manager to locate the APK and tap it to install
# 6. Follow the on-screen prompts to complete installation
#
# NOTES:
# - The APK is a release build suitable for production use
# - The app package name is: com.exo1i.panostitch
# - Backend URL defaults to localhost but can be configured in app settings
# - Camera permissions will be requested when you first use the camera feature

name: Build Android APK

on:
  workflow_dispatch:  # Manual trigger from Actions tab
  push:
    tags:
      - 'mobile-v*'  # Trigger on mobile version tags

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: mobile-app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('mobile-app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install dependencies
        working-directory: mobile-app
        run: npm install
      
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3
      
      - name: Generate native Android code
        working-directory: mobile-app
        run: npx expo prebuild --platform android --clean
      
      - name: Build Android APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panostitch-android-apk
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
